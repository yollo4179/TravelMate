# Common evaluation path on the reused B-plan infrastructure.
# Apply after compose.yaml and compose.reranker-gpu.yaml. The search service runs the mounted current
# repository source against a dedicated *_evaluation search database and the evaluation-profile topics
# that application-evaluation.properties uses. Retrieval settings match Docker/docker-compose.stack.yml
# so the evaluation measures operating retrieval, not the B-plan experiment settings.
services:
  search:
    environment:
      DATABASE_URL: ${TM_EVAL_SEARCH_DATABASE_URL:?Set the dedicated evaluation search database URL}
      KAFKA_PLACE_CHANGES_TOPIC: travelmate.evaluation.place-changes.v1
      KAFKA_RECOMMENDATION_REQUESTS_TOPIC: travelmate.evaluation.recommendation-requests.v1
      KAFKA_RECOMMENDATION_RESULTS_TOPIC: travelmate.evaluation.recommendation-results.v1
      CONTEXTUAL_RELATION_RETRIEVAL: chunk-only
      CONTEXTUAL_RERANK_EVIDENCE_PER_PLACE: "1"
      # Attaches the frozen TourAPI description of bound places (currently 311 and 378) as citable originals.
      PRESERVED_ORIGINAL_EVIDENCE: post-retrieval-field-v1
      # 32 pairs at fp32 overflowed the 6 GB GPU into shared memory; see embedding-server/app/reranker.py.
      RERANK_BATCH_SIZE: "8"
      RERANK_MAX_LENGTH: "1024"
      RERANK_EXECUTION_STRATEGY: ""
