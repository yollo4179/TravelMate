spring.application.name=TravelMate
server.port=8080
embedding.server.url=http://127.0.0.1:8000



#logging.level.com.zaxxer.hikari=DEBUG
#비밀 키들은 모두 ENV 파일로 저장했습니다. 디폴트 값을 지정하지 않으면 크래시 납니다. (주의 ) 
# Spring Bootdml DataSourceAutoConfiguration 가 자동으로 (Hikari)DataSource를 빈으로 등록
spring.datasource.driver-class-name=org.postgresql.Driver
# 로컬 개발 환경 기준 URL (포트번호 5432, DB명 travelmate)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/travel_db}
spring.datasource.username=${DB_USERNAME:__}
spring.datasource.password=${DB_PASSWORD:__}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# 엔티티 객체 수정 시 실 db 컬럼 자동 수정: update :validate는 도커로 
spring.jpa.hibernate.ddl-auto=none
# JPA가 실행하는 쿼리를 콘솔에 출력하고 보기 좋게 정렬
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true





# 절대 외부에 노출되면 안 되는 비밀키 (최소 32글자 이상)
jwt.secret=${JWT_SECRET:TravelMateLocalDevSecretKeyMustBeAtLeast256Bits!}
# Access Token 만료시간 (예: 1시간 = 3600000ms)
jwt.access-expiration=3600000
# Refresh Token 만료시간 (예: 14일 = 1209600000ms)
jwt.refresh-expiration=1209600000
logging.level.com.yollo=debug




spring.data.redis.host=${REDIS_HOST:localhost}
# 레디스 기본 포트
spring.data.redis.port=${REDIS_PORT:6379}
# 로컬 Redis는 비밀번호 없이 사용하고, 외부 Redis는 환경변수로 지정한다.
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=record
travelmate.kafka.place-changes-topic=${KAFKA_PLACE_CHANGES_TOPIC:travelmate.place-changes.v1}
travelmate.kafka.recommendation-requests-topic=${KAFKA_RECOMMENDATION_REQUESTS_TOPIC:travelmate.recommendation-requests.v1}
travelmate.kafka.recommendation-results-topic=${KAFKA_RECOMMENDATION_RESULTS_TOPIC:travelmate.recommendation-results.v1}
kakao.rest-api-key=${KAKAO_REST_API_KEY:}


ollama.base-url =${OLLAMA-BASE-URL:http://localhost:11434}
ollama.model=qwen3:8b

llm.provider=${LLM_PROVIDER:OPENAI}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
openai.model=${OPENAI_MODEL:}
openai.api-key=${OPENAI_API_KEY:}
# Observed 2026-11-05 over 437 calls: router 127, recommendation 527, plan 649 output tokens at most.
openai.max-output-tokens=${OPENAI_MAX_OUTPUT_TOKENS:1024}
openai.context-tokens=${OPENAI_CONTEXT_TOKENS:0}
openai.model-output-limit=${OPENAI_MODEL_OUTPUT_LIMIT:0}
openai.limits-model=${OPENAI_LIMITS_MODEL:}
openai.limits-source=${OPENAI_LIMITS_SOURCE:}
openai.tool-contract-mode=${OPENAI_TOOL_CONTRACT_MODE:STRICT_TOOLS_V1}
openai.evaluation-budget-file=${OPENAI_EVALUATION_BUDGET_FILE:}
ollama.context-tokens=${OLLAMA_CONTEXT_TOKENS:8192}
ollama.max-output-tokens=${OLLAMA_MAX_OUTPUT_TOKENS:1536}
travelmate.observation.directory=${EXECUTION_OBSERVATION_DIRECTORY:build/observations}
travelmate.conversation.max-model-turns=${CONVERSATION_MAX_MODEL_TURNS:6}
travelmate.conversation.max-tool-calls=${CONVERSATION_MAX_TOOL_CALLS:8}
# LiLi replies first without place evidence and picks the branch; SINGLE_LLM_V1 stays for comparison.
travelmate.conversation.modules.routing=${CONVERSATION_ROUTING_MODULE:LILI_ROUTER_V1}

tourapi.service-key=${TOUR-API-KEY:__}



# Missing exact counter configuration blocks Qwen calls; no conservative fallback.
ollama.exact-counter-command=${OLLAMA_EXACT_COUNTER_COMMAND:[]}
ollama.exact-counter-timeout-seconds=${OLLAMA_EXACT_COUNTER_TIMEOUT_SECONDS:90}

ollama.exact-counter-queue-timeout-millis=${OLLAMA_EXACT_COUNTER_QUEUE_TIMEOUT_MILLIS:5000}
ollama.exact-counter-queue-capacity=${OLLAMA_EXACT_COUNTER_QUEUE_CAPACITY:8}

# Shared runtime contract: evaluation overrides connections and limits, not the pipeline.
openai.conversation-response-format=${OPENAI_RESPONSE_FORMAT:JSON_SCHEMA_V1}
openai.reasoning-mode=${OPENAI_REASONING_MODE:DISABLED}
# Requests that fit the input window by byte length skip the provider's count request (InputCountMethod).
openai.input-count-policy=${OPENAI_INPUT_COUNT_POLICY:LOCAL_BOUND_FIRST}
