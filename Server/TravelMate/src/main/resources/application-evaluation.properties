# One separate evaluation process; production application.properties is unchanged.
spring.application.name=TravelMate-evaluation
server.address=127.0.0.1
server.port=${EVAL_SERVER_PORT:18080}
spring.datasource.url=${EVAL_DB_URL}
spring.datasource.username=${EVAL_DB_USERNAME}
spring.datasource.password=${EVAL_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
jwt.secret=${EVAL_JWT_SECRET}
spring.data.redis.host=${EVAL_REDIS_HOST}
spring.data.redis.port=${EVAL_REDIS_PORT}
spring.data.redis.password=${EVAL_REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${EVAL_REDIS_SSL_ENABLED:false}
spring.kafka.bootstrap-servers=${EVAL_KAFKA_BOOTSTRAP_SERVERS}
travelmate.kafka.place-changes-topic=travelmate.evaluation.place-changes.v1
travelmate.kafka.recommendation-requests-topic=travelmate.evaluation.recommendation-requests.v1
travelmate.kafka.recommendation-results-topic=travelmate.evaluation.recommendation-results.v1
embedding.server.url=${EVAL_EMBEDDING_SERVER_URL}
llm.provider=${EVAL_LLM_PROVIDER:OPENAI}
ollama.base-url=${EVAL_OLLAMA_BASE_URL:http://127.0.0.1:11435}
ollama.model=${EVAL_OLLAMA_MODEL:qwen3:8b}
ollama.exact-counter-command=${EVAL_OLLAMA_EXACT_COUNTER_COMMAND:[]}
openai.base-url=${EVAL_OPENAI_BASE_URL:https://api.openai.com/v1}
openai.api-key=${EVAL_OPENAI_API_KEY:}
openai.model=${EVAL_OPENAI_MODEL:}
openai.context-tokens=${EVAL_OPENAI_CONTEXT_TOKENS:0}
# Observed 2026-11-05 over 437 calls: router 127, recommendation 527, plan 649 output tokens at most.
openai.max-output-tokens=${EVAL_OPENAI_MAX_OUTPUT_TOKENS:1024}
openai.model-output-limit=${EVAL_OPENAI_MODEL_OUTPUT_LIMIT:0}
openai.limits-model=${EVAL_OPENAI_LIMITS_MODEL:}
openai.limits-source=${EVAL_OPENAI_LIMITS_SOURCE:}
openai.tool-contract-mode=STRICT_TOOLS_V1
openai.conversation-response-format=${EVAL_OPENAI_RESPONSE_FORMAT:JSON_SCHEMA_V1}
openai.evaluation-budget-file=${EVAL_OPENAI_BUDGET_FILE:}
travelmate.observation.directory=${EVAL_OBSERVATION_DIRECTORY}
# Conversation call limits are inherited from application.properties so evaluation measures operating behavior.
travelmate.conversation.tool-failure-policy=${EVAL_TOOL_FAILURE_POLICY:CONTINUE}
travelmate.conversation.modules.search=${EVAL_CONVERSATION_SEARCH_MODULE:KAFKA_V1}
travelmate.conversation.modules.evidence=${EVAL_CONVERSATION_EVIDENCE_MODULE:ORIGINAL_V1}
travelmate.conversation.modules.prompt=${EVAL_CONVERSATION_PROMPT_MODULE:RESOURCE_V1}
travelmate.conversation.modules.model=${EVAL_CONVERSATION_MODEL_MODULE:GUARDED_V1}
travelmate.conversation.modules.routing=${EVAL_CONVERSATION_ROUTING_MODULE:LILI_ROUTER_V1}
travelmate.conversation.modules.search-ranking=${EVAL_CONVERSATION_SEARCH_RANKING:REQUEST_DEFAULT}
travelmate.conversation.modules.prompt-resource=${EVAL_CONVERSATION_PROMPT_RESOURCE:classpath:conversation/prompts/v2-grounded-system.txt}
# Evaluation must not reuse production map/content credentials.
kakao.rest-api-key=
tourapi.service-key=

openai.reasoning-mode=${EVAL_OPENAI_REASONING_MODE:DISABLED}
# PROVIDER_ALWAYS reproduces runs measured before 2026-11-05; the contract endpoint reports the active policy.
openai.input-count-policy=${EVAL_OPENAI_INPUT_COUNT_POLICY:LOCAL_BOUND_FIRST}

openai.evaluation-budget-requirement=REQUIRED
